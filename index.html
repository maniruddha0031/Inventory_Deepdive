<body class="si-on-deepdive">
<div class="app">

  <!-- ================= LEFT RAIL (Zip Inventory menu) ================= -->

      </button>
      <button title="Waste">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
      <button title="Transfer">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4M21 7H9M7 21l-4-4 4-4M3 17h12"/></svg>
      </button>
      <button title="Recipes">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
      </button>
      <button title="Reports">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      </button>
    </div>
    <div class="fab" title="Support">

  <div class="main">

    <!-- ================= TOP BAR ================= -->

      <div class="tb">

        My Apps <i class="caret"></i>
      </div>
      <div class="tb">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
        Inventory

      <div class="tb">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
        007 - Encinitas <i class="caret"></i>
      </div>

      <div class="center">
        <div class="tb" style="gap:6px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#cfe3f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.2 4.2 0 0 1-.4-8.4A5.7 5.7 0 0 1 17.6 10 4 4 0 0 1 17.2 18z"/></svg>
          78 &deg;F
        </div>
        <span class="divider">|</span>
        <div class="clock">
          <span>09:09</span><span class="sup">A</span><span class="tz">AMERICA/LOS ANGELES</span>
        </div>
      </div>

      <div class="right">
        <div class="store-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16v11H4zM3 9l2-4h14l2 4"/><path d="M9 20v-6h6v6"/></svg>
          Original Fish Taco, LLC <i class="caret"></i>
        </div>
        <div class="pm-wrap" id="pmWrap">
          <button class="avatar-top pm-trigger" title="Profile & settings" onclick="event.stopPropagation(); ivToggleProfileMenu()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>
          </button>
          <div class="pm-menu" onclick="event.stopPropagation()">
            <div class="pm-head">
              <div class="pm-av"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></div>

    <!-- ================= INVENTORY INSIGHT SUB-HEADER ================= -->
    <div class="si-subheader">
      <div class="si-title-wrap">
        <div class="si-title-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
        </div>
        <span class="si-title">Inventory AI Insight</span>
        <span class="si-ai-badge">AI</span>
      </div>
      <a class="si-back" href="#" onclick="event.preventDefault(); ivToast('The Inventory dashboard is not in this folder yet')" title="Back to the Inventory dashboard">
        <span class="si-back-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></span>
        Back to Dashboard
      </a>
      <div class="si-tabs">
        <button class="si-tab soon" title="Coming soon" onclick="ivToast('Inventory Insights are coming soon — Deep Dive is live')">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.4 10.9c.5.4.9 1 .9 1.6v.5h5v-.5c0-.6.4-1.2.9-1.6A6 6 0 0 0 12 3z"/></svg>
          Insights <em>Soon</em>
        </button>
        <button class="si-tab active" data-tab="deepdive">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16M13 13h6M13 17h6"/></svg>
          Deep Dive

      </div>
    </div>

    <div class="si-body">
      <div class="si-panel active" id="tab-deepdive"></div>
    </div>

  </div>
</div>

<!-- KPI trend pop-up (the Schedule deep dive's trend modal) -->
<div id="kpi-modal-root"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="assets/trend-modal-engine.js?v=20261001"></script>
<script src="assets/trend-modal.js?v=20261001"></script>
<script src="assets/si-shared.js?v=20261001"></script>
<script src="assets/inv-deepdive-data.js?v=20261001"></script>
<script src="assets/inv-deepdive-render.js?v=20261001"></script>
<script>
/* profile menu + theme (same keys as Schedule Insight, so the choice is shared) */
function ivToggleProfileMenu(){ const w = document.getElementById('pmWrap'); if (w) w.classList.toggle('open'); }
document.addEventListener('click', () => { const w = document.getElementById('pmWrap'); if (w) w.classList.remove('open'); });
function ivSetTheme(theme){
  const dark = theme === 'dark';
  document.documentElement.classList.toggle('theme-dark', dark);
  try { localStorage.setItem('si-theme', dark ? 'dark' : 'light'); } catch (e) {}
  document.querySelectorAll('.pm-seg button').forEach(b => { const on = b.dataset.theme === (dark ? 'dark' : 'light'); b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  // trend pop-up charts: dark-compatible labels + gridlines, redraw any open chart
  if (window.Chart && Chart.defaults) {
    Chart.defaults.color = dark ? '#94A3B8' : '#666';
    Chart.defaults.borderColor = dark ? 'rgba(148,163,184,.14)' : 'rgba(0,0,0,.1)';
    if (Chart.instances) Object.values(Chart.instances).forEach(c => {
      try {
        Object.values(c.options.scales || {}).forEach(s => { if (s.grid) s.grid.color = Chart.defaults.borderColor; if (s.ticks) s.ticks.color = Chart.defaults.color; });
        c.update('none');
      } catch (e) {}
    });
  }
}
document.addEventListener('DOMContentLoaded', () => {
  ivSetTheme(document.documentElement.classList.contains('theme-dark') ? 'dark' : 'light');
  ivRender();
});
</script>
</body>
</html>
